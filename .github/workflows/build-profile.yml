name: build profile

on:
  schedule:
    - cron: "0 0 * * *" # 07:00 giờ VN
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.mjs]

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate SVG assets
        run: node build.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh contribution city [skip ci]"
          git push
