<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28">
<defs>
  <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.3" stop-color="#22d3ee" stop-opacity="0.5"/>
    <stop offset="0.7" stop-color="#a78bfa" stop-opacity="0.5"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="0" y="13.5" width="1200" height="1" fill="url(#ln)"/>
<rect x="-200" y="13" width="200" height="2" fill="url(#spark)" filter="url(#glow)">
  <animate attributeName="x" values="-200;1200" dur="3.6s" repeatCount="indefinite"/>
</rect>
<rect x="594" y="8" width="12" height="12" fill="#0a0e1f" stroke="#22d3ee" transform="rotate(45 600 14)" filter="url(#glow)">
  <animateTransform attributeName="transform" type="rotate" values="45 600 14;405 600 14" dur="8s" repeatCount="indefinite"/>
</rect>
<circle cx="572" cy="14" r="2" fill="#22d3ee"/><circle cx="628" cy="14" r="2" fill="#a78bfa"/>
</svg>